<main class="container">
<ol class="steps" style="list-style:none;padding:0;margin:0" aria-label="申請進度"><li class="step is-current"><span class="step-dot">1</span><span class="step-label">求助類型與受益人</span><span class="step-line"></span></li><li class="step "><span class="step-dot">2</span><span class="step-label">案件說明與金額</span><span class="step-line"></span></li><li class="step "><span class="step-dot">3</span><span class="step-label">上傳文件</span><span class="step-line"></span></li><li class="step "><span class="step-dot">4</span><span class="step-label">收款帳戶與聲明</span><span class="step-line"></span></li><li class="step "><span class="step-dot">5</span><span class="step-label">送出審核</span><span class="step-line"></span></li></ol><p class="step-caption">步驟 1／5　求助類型與受益人</p>
<div class="page-grid">
<div class="col-main" style="gap:40px">
<div class="stack g12" style="gap:10px"><h1 class="h1">先告訴我們，這次是為了誰、什麼事</h1>
<p class="muted" style="font-size:17px">本平台僅受理為特定個人發起的急難求助。</p></div>
<section class="form-section"><h2 class="h3">求助類型</h2><div class="choice-grid">
<label class="choice"><input type="radio" name="type" checked><span><b>重大傷病</b><small>重症、手術、長期治療</small></span></label><label class="choice"><input type="radio" name="type"><span><b>意外事故</b><small>車禍、工安、意外傷害</small></span></label>
<label class="choice"><input type="radio" name="type"><span><b>災害</b><small>火災、天然災害</small></span></label><label class="choice"><input type="radio" name="type"><span><b>喪葬</b><small>殯葬與後事費用</small></span></label>
<label class="choice"><input type="radio" name="type"><span><b>生活急難</b><small>突發變故造成的生活困難</small></span></label></div></section>
<section class="form-section"><h2 class="h3">誰是受益人？</h2><div class="stack g12">
<label class="choice"><input type="radio" name="who" checked><span><b>我自己</b><small>受益人就是我，我會完成本人身分驗證。</small></span></label>
<label class="choice"><input type="radio" name="who"><span><b>我的家人或親友（我代為發起）</b><small>需要受益人的授權書。</small></span></label>
<label class="choice"><input type="radio" name="who"><span><b>我是受益人的法定代理人</b><small>受益人為未成年或無行為能力者，需附法定代理證明。</small></span></label></div></section>
<section class="form-section"><h2 class="h3">受益人資料</h2>
<div class="form-grid"><label class="field"><span>受益人姓名</span><input class="input" type="text" placeholder="與證件上的姓名一致"></label><label class="field"><span>與您的關係</span><input class="input" type="text" placeholder="例如：本人、配偶、子女"></label><label class="field"><span>聯絡電話</span><input class="input" type="tel" placeholder="[手機號碼]"></label><label class="field"><span>Email</span><input class="input" type="email" placeholder="[Email]"></label></div>
<div class="notice"><svg class="ic" aria-hidden="true"><use href="#info"/></svg><span>接下來會請您完成身分驗證（拍攝證件與人臉辨識）。[eKYC 流程待定]</span></div></section>
<div class="form-actions"><span></span><a class="btn btn-primary btn-lg" href="create-documents.html">儲存並繼續<svg class="ic ic-sm" aria-hidden="true"><use href="#arrow-right"/></svg></a></div>
</div>
<aside class="card col-side col-side-sm" aria-label="說明"><div class="aside-list"><div class="h4">為什麼要問這些？</div><ul class="aside-list"><li><svg class="ic" aria-hidden="true"><use href="#check"/></svg><span>確認案件是為特定個人的求助</span></li><li><svg class="ic" aria-hidden="true"><use href="#check"/></svg><span>驗證受益人身分，保護捐款人與受益人</span></li><li><svg class="ic" aria-hidden="true"><use href="#check"/></svg><span>依類型決定需要準備哪些文件</span></li></ul>
<div class="aside-foot">資料僅供審核使用，不會公開顯示。</div></div></aside>
