<header class="site-header"><div class="container"><a class="brand" href="index.html"><svg width="34" height="37" aria-hidden="true"><use href="#logo"/></svg><span>暖暮集資</span></a>
<div class="row g12"><span class="small muted hide-sm">已經有帳號了？</span><a class="btn btn-secondary" href="login.html">登入</a></div></div></header>
<main class="auth-wrap">
<div class="stack g12"><h1 class="h1">建立帳號</h1>
<p class="muted" style="font-size:17px;line-height:1.75">捐款不需要註冊；若要發起求助，則必須先有募資人帳號。</p></div>
<div class="card card-lg stack" style="gap:36px">
<section class="form-section"><h2 class="h3">您要以什麼身分註冊？</h2><div class="stack g12">
<label class="choice"><input type="radio" name="role" checked><span><b>我要捐款（捐款人）</b><small>保存捐款紀錄與收據，之後捐款更快。捐款不強制註冊，沒有帳號也能直接捐。</small></span></label>
<label class="choice"><input type="radio" name="role"><span><b>我要發起求助（募資人）</b><small>可以發起並管理求助案件。發起求助一定要註冊；提領款項前須提供身分證明。</small></span></label></div>
<div class="notice notice-warn"><svg class="ic" aria-hidden="true"><use href="#info"/></svg><span>每個帳號只能有一種身分，註冊後無法互轉。想同時捐款與發起求助，請用不同的 Email（或不同的 Google 帳號）分別註冊。</span></div>
<p class="small muted" style="line-height:1.7">想直接發起求助？也可以<a href="create-beneficiary.html">從「發起求助」開始</a>，註冊會在建立案件時一併完成。</p></section>
<div class="stack g16"><button type="button" class="btn btn-secondary btn-lg btn-block"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>使用 Google 帳號註冊</button><div class="or-divider"><span>或用 Email 註冊</span></div></div>
<section class="form-section"><h2 class="h3">帳號資料</h2>
<div class="form-grid"><label class="field"><span>Email（作為登入帳號）</span><input class="input" type="email" placeholder="name@example.com"></label><label class="field"><span>密碼</span><input class="input" type="password" placeholder="至少 8 個字元"></label></div></section>
<section class="form-section"><div class="row g12"><h2 class="h3">基本資料</h2><span class="chip">選填</span></div>
<p class="small muted" style="line-height:1.7">以下都可以先留空，之後隨時補填；但要發起求助的募資人，「顯示名稱」不能留空（綽號或小名皆可）。真實姓名與手機不會公開，只用於收據與聯絡。</p>
<div class="form-grid"><label class="field"><span>顯示名稱（綽號或小名皆可）</span><input class="input" type="text" placeholder="公開顯示的名稱"></label><label class="field"><span>真實姓名</span><input class="input" type="text" placeholder="用於收據，不公開"></label><label class="field"><span>手機</span><input class="input" type="tel" placeholder="[手機號碼]"></label><label class="field"><span>所在縣市</span><select class="select"><option>請選擇</option><option>台北市</option><option>新北市</option><option>桃園市</option><option>台中市</option><option>台南市</option><option>高雄市</option><option>其他縣市</option></select></label></div></section>
<section class="form-section"><h2 class="h3">隱私</h2>
<label class="choice"><input type="checkbox"><span><b>捐款與留言時預設匿名</b><small>捐款紀錄與留言不顯示我的名稱，改顯示「匿名」。募資人不適用：發起案件一定要有顯示名稱（綽號或小名皆可），案件頁不能完全匿名。[隱私政策與法遵用語，待律師確認]</small></span></label></section>
<label class="check-row"><input type="checkbox"><span>我已閱讀並同意<a href="terms.html">《使用者條款》</a>與<a href="privacy.html">《隱私政策》</a></span></label>
<button type="button" class="btn btn-primary btn-xl btn-block">建立帳號</button>
<p class="small muted center">已有帳號？<a href="login.html">登入</a></p>
</div></main>
